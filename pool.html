<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASR Plaza - Yopiq Basseyn</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">
</head>
<body style="background: var(--teal); overflow-x: hidden;">
<header class="top">
  <a class="logo" href="index.html"><img src="images/logo.png" alt="" width="46" height="46"><span>Asr Plaza</span></a>
 <nav class="links" id="mnav">
    <a href="index.html#about" data-i18n="nav_about"></a>
    <a href="index.html#menu" data-i18n="nav_menu"></a>
    <a href="index.html#delivery" data-i18n="nav_delivery">Yetkazib berish</a>
    <a href="hotel.html" data-i18n="nav_hotel"></a>
    <a href="pool.html" data-i18n="nav_pool" style="color:var(--gold)"></a>
    <a href="index.html#visit" data-i18n="nav_visit"></a>
    <a class="nav-book btn btn-gold" href="index.html#book" data-i18n="book"></a>
  </nav>
  <div class="lang" role="group">
    <button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
  </div>
  <button class="burger" type="button" aria-controls="mnav"><span></span></button>
</header>

<main id="top" style="padding-top: 3rem; min-height: 80vh;">
  <!-- ===== PREMIUM VIDEO-FON BO'LIMI (To'liq ekranga yoyilgan) ===== -->
  <section class="sec pool" id="pool" style="position: relative; overflow: hidden; padding: 4rem 1rem; min-height: 80vh; display: flex; align-items: center; width: 100vw; max-width: 100vw; margin-left: calc(-50vw + 50%); box-sizing: border-box;">
    
    <!-- Orqa fon videosi -->
    <video class="pool-bg-video" autoplay loop muted playsinline>
      <source src="images/pool/pool-bg.mp4" type="video/mp4">
    </video>
    
    <!-- Yozuvlar zo'r o'qilishi uchun qora shaffof parda -->
    <div class="pool-bg-overlay"></div>

    <!-- Asosiy matn va narxlar (Video ustida turadi) -->
    <div style="position: relative; z-index: 2; max-width: 850px; margin: 0 auto; width: 100%;">
      
      <!-- Narxlar chiqadigan quti (Ichida Skeleton kutish effekti bilan) -->
      <div id="poolGrid">
        <div class="pool-hero-box">
          <div class="skeleton-box">
            <div class="skel-title"></div>
            <div class="skel-price"></div>
            <div class="skel-line"></div>
            <div class="skel-line" style="width: 60%;"></div>
            <div class="skel-btn"></div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ===== PREMIUM BASSEYN GALEREYASI ===== -->
  <section class="pool-gallery-section" style="margin-top: 2rem;">
    <div class="container">
      <div class="bento-gallery">
        <!-- 1: Asosiy katta basseyn -->
        <div class="bento-item item-main">
          <img src="images/pool/pool1.jpg" alt="Premium basseyn zonasi">
          <div class="bento-overlay"><span data-i18n="pool_g1"></span></div>
        </div>
        
        <!-- 2: Kirish qismi -->
        <div class="bento-item item-vertical">
          <img src="images/pool/pool2.jpg" alt="Basseyn kirish qismi">
          <div class="bento-overlay"><span data-i18n="pool_g2"></span></div>
        </div>
        
        <!-- 3: Sauna -->
        <div class="bento-item item-vertical">
          <img src="images/pool/pool3.jpg" alt="Fin saunasi">
          <div class="bento-overlay"><span data-i18n="pool_g3"></span></div>
        </div>
        
        <!-- 4: Oy fonli relax zona -->
        <div class="bento-item item-tall">
          <img src="images/pool/pool4.jpg" alt="Dam olish zonasi">
          <div class="bento-overlay"><span data-i18n="pool_g4"></span></div>
        </div>
        
        <!-- 5: Ikkinchi basseyn ko'rinishi -->
        <div class="bento-item item-wide">
          <img src="images/pool/pool5.jpg" alt="Iliq suvli basseyn">
          <div class="bento-overlay"><span data-i18n="pool_g5"></span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Lightbox: Rasm to'liq ekranda ochiladigan yashirin oyna -->
  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
  </div>
</main>

<footer class="foot">
  <span>© <span id="year"></span> ASR Plaza</span>
  <div class="pool-contacts">
    <a href="tel:+998551527070">+998 55 152 70 70</a>
    <a href="https://instagram.com/asrplazahotel" target="_blank">Instagram</a>
    <a href="https://t.me/asrplaza_hotel" target="_blank">Telegram</a>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
