<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASR Plaza - Mehmonxona</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">
  <style>
    /* ===== MEHMONXONA BO'LIMI: PREMIUM VIBE ===== */
    .sec.hotel {
      position: relative;
      background: linear-gradient(180deg, rgba(249, 246, 240, 0.6) 0%, rgba(201, 162, 104, 0.04) 100%);
      border-radius: 24px;
      padding: 3.5rem 1rem 5rem 1rem;
      overflow: hidden;
    }
    .sec.hotel::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(rgba(201, 162, 104, 0.1) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }
    .sec.hotel > * {
      position: relative;
      z-index: 2;
    }

    /* ===== XONALARNI TEZKOR SARALASH TUGMALARI (TABS) ===== */
    .hotel-filter-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 2.5rem auto 1.5rem auto;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: #ffffff;
      color: var(--teal);
      border: 1px solid rgba(201, 162, 104, 0.4);
      padding: 0.5rem 1.4rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(16, 19, 28, 0.03);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
      box-shadow: 0 6px 20px rgba(201, 162, 104, 0.3);
      transform: translateY(-2px);
    }

    /* Zamonaviy Badge xususiyatlari */
    .fac-features {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      list-style: none;
      padding: 0;
      margin: 1rem 0;
    }
    .fac-features li {
      background: rgba(201, 162, 104, 0.1);
      color: var(--teal);
      border: 1px solid rgba(201, 162, 104, 0.25);
      padding: 0.3rem 0.7rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .fac-features li span {
      color: var(--gold);
    }

    /* ===== STICKY BOOKING BAR (Ekranda doim turuvchi tezkor bron tugmasi) ===== */
    .sticky-booking-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(16, 19, 28, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold);
      padding: 10px 20px;
      border-radius: 999px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 9999;
      animation: bounceIn 0.5s ease;
    }
    .sticky-booking-text {
      color: #fff;
      font-size: 0.88rem;
      font-family: var(--head);
    }
    .sticky-booking-bar .btn {
      padding: 0.4rem 1.2rem;
      font-size: 0.85rem;
    }

    @keyframes bounceIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Premium Mehmonxona Slayder va Thumbnails Uslublari */
    .hotel-slider-box {
      position: relative;
      max-width: 900px;
      margin: 1.5rem auto 1.2rem auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(16, 19, 28, 0.18), 0 0 0 1px rgba(201, 162, 104, 0.35);
      background: var(--teal);
      user-select: none;
    }
    .hotel-slides-track {
      position: relative;
      height: 480px;
      width: 100%;
    }
    .hotel-slide-item {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      pointer-events: none;
    }
    .hotel-slide-item.active {
      opacity: 1;
      pointer-events: auto;
    }
    .hotel-slide-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }
    .slide-caption {
      position: absolute;
      top: 16px; left: 16px;
      background: rgba(16, 19, 28, 0.8);
      color: var(--gold);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(201, 162, 104, 0.4);
      z-index: 5;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    .hotel-slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(16, 19, 28, 0.65);
      color: #fff;
      border: 1px solid var(--gold);
      width: 44px; height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .hotel-slider-btn:hover {
      background: var(--gold);
      color: var(--teal);
    }
    .h-prev { left: 15px; }
    .h-next { right: 15px; }

    .hotel-thumbnails {
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 900px;
      margin: 0 auto 2.5rem auto;
      padding: 0 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .hotel-thumbnails::-webkit-scrollbar { display: none; }
    .thumb-btn {
      position: relative;
      min-width: 75px;
      width: calc(20% - 8px);
      height: 70px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background: #111;
      padding: 0;
      transition: all 0.3s ease;
      opacity: 0.6;
      flex-shrink: 0;
    }
    .thumb-btn img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-btn.active {
      opacity: 1;
      border-color: var(--gold);
      box-shadow: 0 4px 15px rgba(201, 162, 104, 0.4);
      transform: translateY(-2px);
    }

    /* Lightbox */
    .hotel-lightbox {
      display: none;
      position: fixed;
      z-index: 99999;
      inset: 0;
      background-color: rgba(16, 19, 28, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .hotel-lightbox.open {
      display: flex;
      animation: fadeIn 0.3s ease;
    }
    .lightbox-container {
      position: relative;
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lightbox-container img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 14px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      border: 1px solid rgba(201, 162, 104, 0.3);
      object-fit: contain;
    }
    .lightbox-caption {
      margin-top: 0.8rem;
      color: var(--gold);
      font-size: 1rem;
      font-weight: 600;
      font-family: var(--head);
      letter-spacing: 0.5px;
    }
    .lightbox-btn {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      background: rgba(31, 51, 80, 0.8);
      color: #fff;
      border: 1px solid var(--gold);
      width: 44px; height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      z-index: 10;
    }
    .lb-prev { left: 10px; }
    .lb-next { right: 10px; }

    .lightbox-close-btn {
      position: absolute;
      top: -50px; right: 0;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.5rem;
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 768px) {
      .sec.hotel { padding: 1.5rem 0.4rem 4rem 0.4rem; }
      .hotel-slider-box {
        margin: 1rem 0.4rem;
        border-radius: 14px;
      }
      .hotel-slides-track { height: 280px; }
      .hotel-slider-btn { width: 36px; height: 36px; font-size: 0.9rem; }
      .h-prev { left: 10px; }
      .h-next { right: 10px; }
      .slide-caption { font-size: 0.78rem; padding: 0.3rem 0.8rem; top: 12px; left: 12px; }
      .hotel-thumbnails {
        justify-content: flex-start;
        padding: 0 0.4rem;
        gap: 8px;
      }
      .thumb-btn { min-width: 62px; height: 55px; border-radius: 8px; }
      .sticky-booking-bar {
        left: 12px; right: 12px;
        justify-content: space-between;
        bottom: 12px;
        border-radius: 14px;
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>
<header class="top">
  <a class="logo" href="index.html"><img src="images/logo.png" alt="" width="46" height="46"><span>Asr Plaza</span></a>
  <nav class="links" id="mnav">
    <a href="index.html#about" data-i18n="nav_about"></a>
    <a href="index.html#menu" data-i18n="nav_menu"></a>
    <a href="index.html#delivery" data-i18n="nav_delivery">Yetkazib berish</a>
    <a href="hotel.html" data-i18n="nav_hotel" style="color:var(--gold)"></a>
    <a href="pool.html" data-i18n="nav_pool"></a>
    <a href="index.html#visit" data-i18n="nav_visit"></a>
    <a class="nav-book btn btn-gold" href="index.html#book" data-i18n="book"></a>
  </nav>
  <div class="lang" role="group">
    <button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
  </div>
  <button class="burger" type="button" aria-controls="mnav"><span></span></button>
</header>

<main id="top" style="padding-top: 2rem; min-height: 80vh; background: var(--ivory);">
  <section class="sec hotel" id="hotel" style="max-width: 1200px; margin: 0 auto; padding-inline: 0.6rem;">
    <h2 data-i18n="hotel_t" style="text-align:center; font-size: 2.2rem;"></h2>
    <p class="lead" data-i18n="hotel_p" style="text-align:center; margin: 0 auto; padding: 0 1rem;"></p>
    
    <!-- Asosiy Slayder -->
    <div class="hotel-slider-box" id="hotelSliderBox">
      <div class="hotel-slides-track" id="hotelSlidesTrack">
        <div class="hotel-slide-item active">
          <img src="images/hotel/exterior.jpg" alt="Mehmonxona binosi" class="zoomable-img" data-index="0">
          <div class="slide-caption">Mehmonxona binosi</div>
        </div>
        <div class="hotel-slide-item">
          <img src="images/hotel/lounge.jpg" alt="Dam olish zoni (Lounge)" class="zoomable-img" data-index="1">
          <div class="slide-caption">Dam olish zoni (Lounge)</div>
        </div>
        <div class="hotel-slide-item">
          <img src="images/hotel/lobby.jpg" alt="Qabulxona (Lobby)" class="zoomable-img" data-index="2">
          <div class="slide-caption">Qabulxona (Lobby)</div>
        </div>
        <div class="hotel-slide-item">
          <img src="images/hotel/corridor.jpg" alt="Mehmonxona koridori" class="zoomable-img" data-index="3">
          <div class="slide-caption">Mehmonxona koridori</div>
        </div>
        <div class="hotel-slide-item">
          <img src="images/hotel/breakfast.jpg" alt="Nonushta zali" class="zoomable-img" data-index="4">
          <div class="slide-caption">Nonushta zali</div>
        </div>
      </div>
      
      <button class="hotel-slider-btn h-prev" id="hotelPrevBtn" aria-label="Oldingi">&#10094;</button>
      <button class="hotel-slider-btn h-next" id="hotelNextBtn" aria-label="Keyingi">&#10095;</button>
    </div>

    <!-- Pastdagi kichik rasmlar paneli -->
    <div class="hotel-thumbnails" id="hotelThumbnails">
      <button class="thumb-btn active" data-index="0"><img src="images/hotel/exterior.jpg" alt="Bino"></button>
      <button class="thumb-btn" data-index="1"><img src="images/hotel/lounge.jpg" alt="Lounge"></button>
      <button class="thumb-btn" data-index="2"><img src="images/hotel/lobby.jpg" alt="Lobby"></button>
      <button class="thumb-btn" data-index="3"><img src="images/hotel/corridor.jpg" alt="Koridor"></button>
      <button class="thumb-btn" data-index="4"><img src="images/hotel/breakfast.jpg" alt="Nonushta"></button>
    </div>

    <!-- Xonalar uchun tezkor saralash tugmalari -->
    <div class="hotel-filter-tabs" id="hotelFilterTabs">
      <button class="filter-btn active" data-filter="all">Barchasi</button>
      <button class="filter-btn" data-filter="standard">Standard</button>
      <button class="filter-btn" data-filter="deluxe">Deluxe</button>
      <button class="filter-btn" data-filter="triple">Triple</button>
      <button class="filter-btn" data-filter="luxury">Luxury</button>
    </div>

    <div class="facility-grid" id="hotelGrid"></div>
    <div class="hotel-info-box" id="hotelInfo"></div>
  </section>
</main>

<!-- Lightbox -->
<div class="hotel-lightbox" id="hotelLightbox">
  <div class="lightbox-container">
    <button class="lightbox-close-btn" id="lightboxClose">&times;</button>
    <button class="lightbox-btn lb-prev" id="lbPrevBtn">&#10094;</button>
    <img id="lightboxImg" src="" alt="Kattalashtirilgan rasm">
    <button class="lightbox-btn lb-next" id="lbNextBtn">&#10095;</button>
    <div class="lightbox-caption" id="lightboxCaption">Mehmonxona binosi (1 / 7)</div>
  </div>
</div>

<!-- Ekranda doim turuvchi tezkor bron tugmasi -->
<div class="sticky-booking-bar">
  <div class="sticky-booking-text">✨ Xona band qilmoqchimisiz?</div>
  <a href="https://t.me/AsrPlazaHotel_bot?text=Assalomu%20alaykum!%20Men%20xona%20band%20qilmoqchiman.%0A%0A%F0%9F%8F%A8%20Xona%20turi:%20%0A%F0%9F%91%A5%20Mehmonlar%20soni:%20%0A%F0%9F%93%85%20Kelish%20sanasi:%20%0A%F0%9F%93%9E%20Telefon:%20" target="_blank" rel="noopener" class="btn btn-gold">Band qilish</a>
</div>

<footer class="foot">
  <span>© <span id="year"></span> ASR Plaza Hotel</span>
  <span id="footContact"></span>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/nav.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const slides = document.querySelectorAll('.hotel-slide-item');
    const thumbs = document.querySelectorAll('.thumb-btn');
    const prevBtn = document.getElementById('hotelPrevBtn');
    const nextBtn = document.getElementById('hotelNextBtn');
    const sliderBox = document.getElementById('hotelSliderBox');
    
    const lightbox = document.getElementById('hotelLightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');
    const closeBtn = document.getElementById('lightboxClose');
    const lbPrevBtn = document.getElementById('lbPrevBtn');
    const lbNextBtn = document.getElementById('lbNextBtn');

    const galleryData = [
      { src: "images/hotel/exterior.jpg", title: "Mehmonxona binosi" },
      { src: "images/hotel/lounge.jpg", title: "Dam olish zoni (Lounge)" },
      { src: "images/hotel/lobby.jpg", title: "Qabulxona (Lobby)" },
      { src: "images/hotel/corridor.jpg", title: "Mehmonxona koridori" },
      { src: "images/hotel/breakfast.jpg", title: "Nonushta zali" },
      { src: "images/hotel/breakfast1.jpg", title: "Shved stoli tanlovi" },
      { src: "images/hotel/breakfast2.jpg", title: "Nonushta va shirinliklar" }
    ];

    let currentIndex = 0;
    let lightboxIndex = 0;
    let autoTimer;

    let touchStartX = 0;
    let touchEndX = 0;

    sliderBox.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    sliderBox.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) { nextSlide(); restartTimer(); }
      if (touchEndX > touchStartX + 50) { prevSlide(); restartTimer(); }
    }, { passive: true });

    function updateSlide(index) {
      slides.forEach(s => s.classList.remove('active'));
      thumbs.forEach(t => t.classList.remove('active'));
      currentIndex = (index + slides.length) % slides.length;
      slides[currentIndex].classList.add('active');
      thumbs[currentIndex].classList.add('active');
      const thumb = thumbs[currentIndex];
      const container = document.getElementById('hotelThumbnails');
      const scrollLeftPos = thumb.offsetLeft - (container.offsetWidth / 2) + (thumb.offsetWidth / 2);
      container.scrollTo({ left: scrollLeftPos, behavior: 'smooth' });
    }

    function nextSlide() { updateSlide(currentIndex + 1); }
    function prevSlide() { updateSlide(currentIndex - 1); }

    nextBtn.addEventListener('click', (e) => { e.preventDefault(); nextSlide(); restartTimer(); });
    prevBtn.addEventListener('click', (e) => { e.preventDefault(); prevSlide(); restartTimer(); });

    thumbs.forEach(thumb => {
      thumb.addEventListener('click', (e) => {
        e.preventDefault();
        updateSlide(parseInt(thumb.getAttribute('data-index')));
        restartTimer();
      });
    });

    function openLightbox(index) {
      lightboxIndex = (index + galleryData.length) % galleryData.length;
      lightboxImg.src = galleryData[lightboxIndex].src;
      lightboxCaption.textContent = `${galleryData[lightboxIndex].title} (${lightboxIndex + 1} / ${galleryData.length})`;
      lightbox.classList.add('open');
      clearInterval(autoTimer);
    }

    document.addEventListener('click', (e) => {
      const targetImg = e.target.closest('.zoomable-img');
      if (targetImg) {
        e.preventDefault();
        const idx = parseInt(targetImg.getAttribute('data-index'));
        if (!isNaN(idx)) openLightbox(idx);
      }
    });

    lbNextBtn.addEventListener('click', (e) => { e.stopPropagation(); openLightbox(lightboxIndex + 1); });
    lbPrevBtn.addEventListener('click', (e) => { e.stopPropagation(); openLightbox(lightboxIndex - 1); });

    function closeLightbox() {
      lightbox.classList.remove('open');
      startTimer();
    }

    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

    function startTimer() { autoTimer = setInterval(nextSlide, 5000); }
    function restartTimer() { clearInterval(autoTimer); startTimer(); }
    startTimer();
  });
</script>
</body>
</html>
